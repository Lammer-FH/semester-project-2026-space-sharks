services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel_booking
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_PASSWORD: root
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/hotel_booking?createDatabaseIfNotExist=true&serverTimezone=UTC
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
